name: Build GeoScan APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          python3 -c "import zipfile,glob; z=glob.glob('*.zip'); assert z, 'ZIP not found'; zipfile.ZipFile(z[0]).extractall('project')"

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)")
          cat > /tmp/java17.gradle <<'EOF'
          allprojects {
            tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
              sourceCompatibility = '17'
              targetCompatibility = '17'
            }
          }
          EOF
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          ./gradle-8.9/bin/gradle -I /tmp/java17.gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoScan-APK
          path: project/**/build/outputs/apk/**/*.apk
