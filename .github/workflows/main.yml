
name: Build GeoScan APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p project
          python3 -c "import zipfile,glob; z=glob.glob('*.zip'); assert z, 'ZIP file not found'; zipfile.ZipFile(z[0]).extractall('project')"

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi

          cat > /tmp/java17.gradle <<'EOF'
          allprojects {
              tasks.matching { it.name.startsWith("compile") && it.name.endsWith("Kotlin") }.configureEach {
                  kotlinOptions.jvmTarget = "1.8"
              }
          }
          EOF

          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          ./gradle-8.9/bin/gradle -p "$PROJECT_DIR" -I /tmp/java17.gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoScan-APK
          path: project/**/build/outputs/apk/**/*.apk
