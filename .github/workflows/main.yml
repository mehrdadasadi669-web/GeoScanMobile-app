name: Build GeoScan APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          python3 -c "import zipfile,glob; zipfile.ZipFile(glob.glob('*.zip')[0]).extractall('project')"

      - name: Build APK
        run: |
          chmod +x $(find project -name gradlew | head -1)
          cd $(dirname $(find project -name gradlew | head -1))
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoScan-APK
          path: project/**/build/outputs/apk/**/*.apk
